<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">mouse-passthrough — wiring / pinout</text>

  <!-- Superlight mouse -->
  <rect x="20" y="70" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="95" text-anchor="middle" font-size="13" fill="#0f172a">Logitech G Pro X</text>
  <text x="95" y="112" text-anchor="middle" font-size="13" fill="#0f172a">Superlight</text>

  <!-- wireless squiggle to dongle -->
  <path d="M170,100 C 200,80 230,120 260,100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="215" y="75" text-anchor="middle" font-size="11" fill="#64748b">2.4GHz Lightspeed</text>

  <!-- Lightspeed dongle -->
  <rect x="260" y="70" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="340" y="95" text-anchor="middle" font-size="13" fill="#1e1b4b">Lightspeed dongle</text>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#4338ca">USB 046D:C547</text>

  <!-- dongle -> USB-A breakout -->
  <line x1="340" y1="130" x2="340" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- USB-A breakout -->
  <rect x="240" y="190" width="200" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">USB-A female breakout</text>
  <text x="255" y="232" font-size="11.5" fill="#7c2d12">VBUS (red)   → 5V   (J1-21)</text>
  <text x="255" y="248" font-size="11.5" fill="#7c2d12">D−   (white) → GPIO19 (J3-20)</text>
  <text x="255" y="264" font-size="11.5" fill="#7c2d12">D+   (green) → GPIO20 (J3-19)</text>
  <text x="255" y="277" font-size="11.5" fill="#7c2d12">GND  (black) → GND  (J3-21)</text>

  <line x1="340" y1="280" x2="340" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ESP32-S3 DevKitC-1 box -->
  <rect x="180" y="330" width="320" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="340" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">ESP32-S3-DevKitC-1 (N32R16V)</text>
  <text x="340" y="373" text-anchor="middle" font-size="11.5" fill="#065f46">USB HOST — parses dongle reports</text>
  <line x1="200" y1="382" x2="480" y2="382" stroke="#a7f3d0" stroke-width="1"/>
  <text x="200" y="400" font-size="11.5" fill="#065f46">GPIO19/20 ← dongle D−/D+ (above)</text>
  <text x="200" y="416" font-size="11.5" fill="#065f46">5V / GND  ← dongle power (above)</text>
  <text x="200" y="436" font-size="12" font-weight="bold" fill="#047857">GPIO47 (TX) ──────► Pico GP1</text>
  <text x="200" y="452" font-size="12" font-weight="bold" fill="#047857">GPIO48 (RX) ◄────── Pico GP0</text>
  <text x="200" y="468" font-size="12" font-weight="bold" fill="#047857">GND         ─────── Pico GND</text>

  <!-- ESP32 UART port -> PC (flash/console, dashed, routed clear of the Pico box) -->
  <path d="M500,344 C 680,300 880,300 955,330" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="955" y1="330" x2="955" y2="548" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="800" y="298" text-anchor="middle" font-size="11" fill="#64748b">UART port (CP210x) — flash + debug console only</text>
  <text x="800" y="312" text-anchor="middle" font-size="11" fill="#64748b">this machine: COM9</text>

  <!-- ESP32 <-> Pico 3-wire link -->
  <line x1="500" y1="400" x2="640" y2="400" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="422" x2="640" y2="422" stroke="#0f766e" stroke-width="2" marker-start="url(#arrow)"/>
  <line x1="500" y1="444" x2="640" y2="444" stroke="#0f766e" stroke-width="2"/>
  <text x="570" y="393" text-anchor="middle" font-size="10.5" fill="#0f766e">TX→RX</text>
  <text x="570" y="415" text-anchor="middle" font-size="10.5" fill="#0f766e">RX←TX</text>
  <text x="570" y="437" text-anchor="middle" font-size="10.5" fill="#0f766e">GND</text>

  <!-- Pico H box -->
  <rect x="640" y="330" width="300" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="790" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Raspberry Pi Pico H</text>
  <text x="790" y="373" text-anchor="middle" font-size="11.5" fill="#1e40af">USB DEVICE — HID mouse + CDC</text>
  <line x1="656" y1="382" x2="924" y2="382" stroke="#bfdbfe" stroke-width="1"/>
  <text x="656" y="402" font-size="12" font-weight="bold" fill="#1d4ed8">GP1 / pin 2 (RX) ← ESP32 GPIO47</text>
  <text x="656" y="420" font-size="12" font-weight="bold" fill="#1d4ed8">GP0 / pin 1 (TX) → ESP32 GPIO48</text>
  <text x="656" y="438" font-size="12" font-weight="bold" fill="#1d4ed8">GND / pin 3 ── ESP32 GND</text>
  <text x="656" y="460" font-size="11.5" fill="#1e40af">USB connector → PC (below)</text>

  <!-- Pico -> PC -->
  <line x1="820" y1="480" x2="820" y2="548" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="518" font-size="11" fill="#334155">USB cable</text>

  <!-- PC box -->
  <rect x="700" y="550" width="290" height="70" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="845" y="577" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">PC</text>
  <text x="845" y="595" text-anchor="middle" font-size="11" fill="#334155">Pico CDC (COM7) — HID mouse</text>
  <text x="845" y="609" text-anchor="middle" font-size="11" fill="#334155">Tauri control app ↔ Pico JSON</text>

  <!-- legend -->
  <line x1="20" y1="560" x2="60" y2="560" stroke="#334155" stroke-width="2"/>
  <text x="66" y="564" font-size="11" fill="#334155">runtime signal path</text>
  <line x1="20" y1="580" x2="60" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="66" y="584" font-size="11" fill="#64748b">flash / debug only (not in the passthrough path)</text>
</svg>
